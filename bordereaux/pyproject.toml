[project]
name = "bordereaux"
version = "0.1.0"
description = "Claims bordereaux aggregation and segregation tool (MVP)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.9",
    "pandera>=0.20",
    "anthropic>=0.40",
    "streamlit>=1.38",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["Faker>=30.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
