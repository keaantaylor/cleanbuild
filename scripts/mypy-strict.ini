# mypy configuration for the strict (new-module) pass in scripts/verify.py.
[mypy]
plugins = pydantic.mypy
strict = True
ignore_missing_imports = True
explicit_package_bases = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

# Legacy test helpers imported by strict tests: analysed for their signatures,
# not held to strict mode themselves (they are not in strict_paths).
[mypy-conftest]
ignore_errors = True
