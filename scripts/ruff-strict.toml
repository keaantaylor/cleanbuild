# Strict ruff configuration for new modules (scripts/quality.json -> strict_paths).
# Legacy code is checked separately with the minimal E4/E7/E9/F ruleset.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "N", "A", "C4", "PIE", "T20", "BLE", "ERA"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S310", "S105", "S106"]
# Golden suites are tests; spreadsheet cells carry naive dates by nature (Excel has no time zone).
"fixtures/golden/**" = ["S101", "DTZ001"]
"scripts/verify.py" = ["T201", "S603"]

[lint.flake8-bugbear]
# FastAPI dependency/parameter declarations are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Header", "fastapi.File", "fastapi.Form"]
