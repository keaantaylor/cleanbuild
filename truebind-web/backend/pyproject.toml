[project]
name = "truebind-backend"
version = "0.1.0"
description = "Truebind FastAPI backend (Next.js + FastAPI redesign, Phase 0)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = ["slow: spawns real worker child processes", "pg: requires TRUEBIND_TEST_DATABASE_URL (PostgreSQL)"]
