services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: truebind
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: truebind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truebind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Wide context so the Dockerfile can also copy the sibling
      # bordereaux/ package the backend depends on -- see backend/Dockerfile.
      context: ..
      dockerfile: truebind-web/backend/Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://truebind:dev@postgres:5432/truebind
      CORS_ORIGINS: http://localhost:3000
      # Runs the job worker loop inside the API container (each job still
      # runs in its own memory/time-limited child process). For more
      # throughput run `python -m app.worker` as separate containers instead.
      TRUEBIND_EMBEDDED_WORKER: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
